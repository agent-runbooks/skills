<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runbook run</title>
<style>
:root {
  --bg: #f3f3f4;
  --panel: #ffffff;
  --ink: #18181b;
  --muted: #66666f;
  --rule: #dcdce0;
  --select: #e9e9ec;
  --done: #66666f;
  --ok: #2c7548;
  --running: #2457c5;
  --waiting: #8f520c;
  --failed: #b3312f;
  --add-bg: #dff1e3;
  --del-bg: #f8e1df;
  --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131314;
    --panel: #19191b;
    --ink: #e4e4e7;
    --muted: #8b8b93;
    --rule: #2a2a2e;
    --select: #232327;
    --done: #9a9aa2;
    --ok: #7cc492;
    --running: #8ab4f8;
    --waiting: #e2a55a;
    --failed: #ec7b72;
    --add-bg: #18301f;
    --del-bg: #3a2020;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--running); outline-offset: 1px; }

header {
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--rule);
}
.title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-family: var(--mono); }
.title h1 { font-size: 16px; margin: 0; font-weight: 600; }
.title #runbook { color: var(--muted); }
#status {
  font-size: 12px;
  line-height: 1;
  padding: 4px 9px;
  border: 1px solid currentColor;
  border-radius: 999px;
  color: var(--muted);
  background: color-mix(in srgb, currentColor 12%, transparent);
}
#status.chip-ok { color: var(--ok); }
#status.chip-attention { color: var(--waiting); }
#status.chip-failed { color: var(--failed); }
#status:empty { display: none; }
.inputs-box { margin: 8px 0 0; font: 12px/1.45 var(--mono); }
.inputs-box summary { cursor: pointer; width: fit-content; max-width: 100%; }
.inputs-box summary span { color: var(--muted); margin-left: 6px; }
.inputs-box[open] summary span { display: none; }
.inputs {
  margin: 6px 0 0;
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 1px 12px;
  font: 12px/1.45 var(--mono);
}
.inputs dt { color: var(--muted); }
.inputs dd { margin: 0; overflow-wrap: anywhere; }
.notice { color: var(--failed); font: 12px var(--mono); margin-top: 6px; }

main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(300px, 36%) minmax(0, 1fr);
}
nav {
  border-right: 1px solid var(--rule);
  overflow: auto;
  padding: 10px 0 20px;
}
.nav-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px 6px;
}
.label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#follow {
  border: 1px solid var(--rule);
  background: transparent;
  border-radius: 4px;
  padding: 1px 8px;
  font-size: 12px;
  cursor: pointer;
}
#follow[aria-pressed="true"] { color: var(--muted); cursor: default; }

.rows { display: grid; grid-template-columns: auto auto auto auto minmax(0, 1fr); font: 13px/1.4 var(--mono); }
.row { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; cursor: pointer; }
.row > span { padding: 3px 0 3px 10px; white-space: nowrap; }
.row > span:first-child { padding-left: 20px; }
.row > span:last-child { padding-right: 20px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.row:hover, .row.selected { background: var(--select); }
.row.selected { box-shadow: inset 3px 0 0 var(--running); }
.row:focus-visible { outline-offset: -2px; }
.row .exec { color: var(--muted); }
.row .dur { text-align: right; font-variant-numeric: tabular-nums; }
.mark-done { color: var(--done); }
.mark-running { color: var(--running); }
.mark-waiting_for_human { color: var(--waiting); font-weight: 700; }
.mark-failed, .mark-blocked { color: var(--failed); }
.row.waiting_for_human > span, .row.waiting_for_human > span:last-child { color: var(--waiting); }
.mark-running.live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .mark-running.live { animation: none; } }

.files { margin: 18px 0 0; }
.files .label { padding: 0 20px 4px; display: block; }
.file-link {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 2px 20px;
  font: 13px/1.5 var(--mono);
  cursor: pointer;
}
.file-link:hover, .file-link.selected { background: var(--select); }
.file-link.selected { box-shadow: inset 3px 0 0 var(--running); }
.empty { padding: 0 20px; color: var(--muted); font-size: 13px; }

#detail { overflow: auto; padding: 16px 28px 40px; background: var(--panel); }
.detail-head { font: 600 15px var(--mono); margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.detail-head .meta { font-weight: 400; color: var(--muted); font-size: 13px; }
.ask {
  border-left: 3px solid var(--waiting);
  padding: 8px 14px;
  margin: 0 0 16px;
  background: var(--bg);
}
.ask strong { color: var(--waiting); }
.ask p { margin: 4px 0; }
.log {
  font: 12px/1.55 var(--mono);
  color: var(--muted);
  margin: 0 0 18px;
  padding: 0;
  list-style: none;
  overflow-wrap: anywhere;
}
.doc { border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 18px; }
.doc:first-of-type { margin-top: 0; }
.doc-name { font: 12px var(--mono); color: var(--muted); margin-bottom: 6px; }

.md { max-width: 80ch; overflow-wrap: break-word; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.25; margin: 1.2em 0 .4em; }
.md h1 { font-size: 20px; }
.md h2 { font-size: 16px; }
.md h3, .md h4 { font-size: 14px; }
.md > :first-child { margin-top: 0; }
.md a { color: var(--running); }
.md code { font: 12.5px var(--mono); background: var(--select); padding: 0 4px; border-radius: 3px; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--rule); padding: 3px 8px; text-align: left; vertical-align: top; }
.md blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--rule); color: var(--muted); }
pre {
  font: 12.5px/1.5 var(--mono);
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 10px 12px;
  overflow-x: auto;
  white-space: pre;
}
.raw { white-space: pre-wrap; overflow-wrap: anywhere; }
.diff span { display: block; }
.diff .add { background: var(--add-bg); }
.diff .del { background: var(--del-bg); }
.diff .hunk { color: var(--running); }
.diff .head { color: var(--muted); }

@media (max-width: 899px) {
  main { display: block; overflow: auto; }
  nav { border-right: 0; border-bottom: 1px solid var(--rule); overflow: visible; }
  #detail { overflow: visible; padding: 16px 20px 40px; }
}
</style>
</head>
<body>
<header>
  <div class="title"><h1 id="name">…</h1><span id="runbook"></span><span id="status"></span></div>
  <details class="inputs-box">
    <summary>inputs <span id="inputs-names"></span></summary>
    <dl class="inputs" id="inputs"></dl>
  </details>
  <div class="notice" id="notice" hidden></div>
</header>
<main>
  <nav>
    <div class="nav-head"><span class="label">Sections</span><button id="follow" type="button" aria-pressed="true">following</button></div>
    <div class="rows" id="sections"></div>
    <div class="files"><span class="label">Run files</span><div id="run-files"></div></div>
  </nav>
  <section id="detail" aria-live="polite"></section>
</main>
<script src="marked.umd.js"></script>
<script src="page.js"></script>
</body>
</html>
