name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runbook-engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest test_runbook -v
        working-directory: skills/agent-runbook-authoring/references
      - run: python -m unittest test_view -v
        working-directory: skills/runbook-viewer
