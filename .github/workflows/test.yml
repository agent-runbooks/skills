name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runbook-engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest test_runbook -v
        working-directory: skills/agent-runbook-authoring/references
      - run: python -m unittest test_view -v
        working-directory: skills/runbook-viewer
      - if: matrix.python == '3.13'
        run: |
          cmp ../runbook.py runbook.py
          python flow.py --check
        working-directory: skills/agent-runbook-authoring/references/runbook-review-loop
