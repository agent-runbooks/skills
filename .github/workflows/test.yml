name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin-version:
    # Claude Code updates an installed plugin only when its version changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: A change to what the plugin ships raises its version
        run: |
          if git diff --quiet HEAD^1 HEAD -- skills ':(exclude,glob)skills/**/test_*.py'; then exit 0; fi
          old=$(git show HEAD^1:.claude-plugin/plugin.json | jq -r .version)
          new=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$old" = "$new" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=.claude-plugin/plugin.json::skills/ changed, so raise version above $old"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen pyright
      - run: uv build

  runbook-engine:
    # setup-python has no Python 3.9 build for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest test_runbook -v
        working-directory: skills/agent-runbook-authoring/references
      - run: python -m unittest test_view -v
        working-directory: skills/runbook-viewer
      - if: matrix.python == '3.13'
        run: python -m unittest tests.test_readme -v
      - if: matrix.python == '3.13'
        run: |
          cmp ../agent_runbooks.py agent_runbooks.py
          python flow.py --check
        working-directory: skills/agent-runbook-authoring/references/runbook-review-loop
