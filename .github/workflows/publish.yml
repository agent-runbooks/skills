name: publish

on:
  push:
    tags: ['agent-runbook-authoring/v*']

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: The tag names the version that was built
        run: |
          version=$(uv run --no-project --with dist/*.whl python -c 'import agent_runbooks; print(agent_runbooks.__version__)')
          test "$GITHUB_REF_NAME" = "agent-runbook-authoring/v$version"
      - run: uv publish --trusted-publishing always
