# The engine's PyPI package and the dev tooling. The skills ship without this file and run on the standard library.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-runbooks"
dynamic = ["version"]
description = "The engine behind a runbook's flow.py"
readme = "skills/agent-runbook-authoring/README.md"
requires-python = ">=3.9"
license-files = ["LICENSE"]

[project.urls]
Source = "https://github.com/agent-runbooks/skills/tree/main/skills/agent-runbook-authoring"
Changelog = "https://github.com/agent-runbooks/skills/blob/main/skills/agent-runbook-authoring/CHANGELOG.md"

[dependency-groups]
dev = [
  "pyright==1.1.414",
  "ruff==0.16.10",
]

# uv sync leaves the package out: the dev environment needs only the tools.
[tool.uv]
package = false

[tool.hatch.version]
path = "skills/agent-runbook-authoring/references/agent_runbooks.py"

# The wheel is the engine alone, the same agent_runbooks.py a runbook can carry as a copy.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"skills/agent-runbook-authoring/references/agent_runbooks.py" = "agent_runbooks.py"

[tool.hatch.build.targets.sdist]
only-include = ["skills/agent-runbook-authoring/references/agent_runbooks.py", "skills/agent-runbook-authoring/README.md", "LICENSE"]

[tool.ruff]
line-length = 120
# A byte-for-byte copy of references/agent_runbooks.py; CI compares the two.
extend-exclude = ["skills/agent-runbook-authoring/references/runbook-review-loop/agent_runbooks.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter owns line length; what it leaves long is string literals.
# SIM117: a merged `with` this long needs parentheses, which Python 3.9 lacks.
# UP036: the engine and the viewer check the interpreter version on purpose, they run on whatever python3 the machine has.
ignore = ["E501", "SIM117", "UP036"]

[tool.ruff.format]
quote-style = "single"
# Code samples in the docs keep their hand layout.
exclude = ["*.md"]

[tool.pyright]
include = ["skills"]
exclude = ["skills/agent-runbook-authoring/references/runbook-review-loop/agent_runbooks.py"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
